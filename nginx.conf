# Reverse proxy: ONLY 8000 is published. Browser-native HTTP Basic Auth is absent.
user www-data;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  sendfile on;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  server {
    listen 0.0.0.0:8000;
    server_name _;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;

    # Only Nginx may call this endpoint. Nginx forwards the browser session cookie.
    location = /_auth {
      internal;
      proxy_pass http://127.0.0.1:8001/internal/auth-check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length '';
      proxy_set_header Cookie $http_cookie;
    }
    # Do not expose the FastAPI internal auth endpoint from the public proxy.
    location = /internal/auth-check { return 404; }

    # Authenticate BOTH the noVNC static page and its WebSocket handshake.
    # Since this is cookie/session auth, it never triggers a browser Basic Auth popup.
    location /novnc/ {
      auth_request /_auth;
      proxy_pass http://127.0.0.1:6080/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://127.0.0.1:8001;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
